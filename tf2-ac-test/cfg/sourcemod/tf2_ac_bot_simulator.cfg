// TF2 AC Bot Simulator
// Install to: tf/cfg/sourcemod/tf2_ac_bot_simulator.cfg

sm_acsim_enabled "1"

// Controlled actor is always a fake client. Targets are humans only by default.
sm_acsim_target_humans_only "1"

// Deliberately obvious, non-human profile.
sm_acsim_snap_fov_min "24.0"
sm_acsim_snap_fov_max "40.0"
sm_acsim_snap_ticks_min "1"
sm_acsim_snap_ticks_max "3"
sm_acsim_fire_ticks "2"

// Mostly normal bot behavior between synthetic events.
sm_acsim_event_interval_min "45.0"
sm_acsim_event_interval_max "90.0"

// Hidden-target calibration. Attack is forcibly blocked during this state.
sm_acsim_wall_enabled "1"
sm_acsim_wall_fov "45.0"
sm_acsim_wall_duration "0.75"

// Separate ground-truth log; detector never reads it.
sm_acsim_groundtruth_log "1"
