// TF2 AC Shadow Detector
// Install to: tf/cfg/sourcemod/tf2_ac_shadow_detector.cfg

sm_acdet_enabled "1"

// Safe calibration default: humans are not scored.
sm_acdet_bots_only "1"

// Hard snap + hit correlation.
sm_acdet_snap_degrees "7.5"
sm_acdet_snap_hit_window "0.30"
sm_acdet_snap_score "45"

// Hidden-target lock.
sm_acdet_wall_cone "1.75"
sm_acdet_wall_hold "0.45"
sm_acdet_wall_score "60"
sm_acdet_wall_scan_interval "0.05"

// Fast target switch after a kill.
sm_acdet_switch_window "0.45"
sm_acdet_switch_score "30"

// Shadow decision only. No real ban call exists in the plugin.
sm_acdet_threshold "100"
sm_acdet_admin_alerts "1"
